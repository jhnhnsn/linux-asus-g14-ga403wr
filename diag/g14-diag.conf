# /etc/g14-diag.conf — sourced by /usr/local/bin/g14-diag
DIAG_DIR=/var/log/g14-diag
DIAG_GROUP=wheel          # who may read bundles / add notes (bundles contain full logs)
RETENTION_DAYS=60
GUARD_MODE=enforce        # enforce: refuse sleep if nvidia can't be unloaded | warn: notify only
TAIL_LINES=300
NOISE_FILTER='UFW BLOCK'  # regex dropped from tail.log
