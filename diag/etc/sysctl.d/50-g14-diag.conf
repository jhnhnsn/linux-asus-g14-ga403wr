# Turn silent freezes into evidence.
# A stuck CPU panics (-> pstore crash record -> auto-reboot after kernel.panic seconds)
# instead of hanging forever. Pair with cmdline `nmi_watchdog=panic panic=20`.
kernel.softlockup_panic = 1
# Full Magic SysRq from the keyboard. During a freeze: Alt+SysRq+W (dump blocked tasks to
# the log), then Alt+SysRq+C (force a crash record). Physical-keyboard only.
kernel.sysrq = 1
