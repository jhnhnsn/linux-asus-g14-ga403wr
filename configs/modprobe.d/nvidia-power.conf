# /etc/modprobe.d/nvidia-power.conf
# Hybrid AMD iGPU + NVIDIA dGPU on s2idle-only platform (Strix Halo).
# Enable NVIDIA s0ix/modern-standby power management and preserve VRAM
# across suspend so the system reliably resumes from a closed lid.
# NOTE: needs `sudo mkinitcpio -P` + reboot to go live.
options nvidia NVreg_EnableS0ixPowerManagement=1 NVreg_PreserveVideoMemoryAllocations=1
