# /etc/modprobe.d/nvidia-power.conf
# Hybrid AMD iGPU (primary) + NVIDIA dGPU (render-offload) on an s2idle-only
# platform (Strix Halo / GA403WR).
#
# Path B — modern "default" NVIDIA power management (kernel suspend-notifier
# callbacks). We do NOT preserve VRAM across suspend and the
# nvidia-suspend/resume/hibernate services are DISABLED. This avoids the
# heavyweight save/restore-VRAM path that corrupted on resume (RM backref-unmap
# assertion storm -> compositor SIGABRT) and aborted hibernate (nv_pmops_freeze
# returns -5). Full rationale + sources: docs/nvidia-suspend-path-b.md
#
# Trade-off: GPU contexts are not saved across suspend (don't suspend mid-game).
# Complementary: nvidia kept OUT of the initramfs (initcpio/install/nvidia-noinitramfs),
# nvidia_drm modeset=1 (nvidia-drm.conf), DynamicPowerManagement=2 (utils default).
#
# NOTE: needs `sudo mkinitcpio -P` + `sudo limine-update` + reboot to go live.
options nvidia NVreg_PreserveVideoMemoryAllocations=0
