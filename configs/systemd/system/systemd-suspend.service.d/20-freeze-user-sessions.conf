# Override nvidia's /usr/lib/.../10-nvidia-no-freeze-session.conf.
# That drop-in disables user-session freezing so NVIDIA's VRAM-save services can
# run during suspend. We run Path B (NVreg_PreserveVideoMemoryAllocations=0 and
# nvidia-{suspend,resume,hibernate}.service all DISABLED), so nothing in userspace
# needs to run during s2idle. Leaving sessions unfrozen kept niri + the whole
# desktop live through suspend, spiking s2idle power and destabilizing long
# (overnight) sleeps -> the machine wedged in s0ix and never resumed (2026-06-14).
# Re-enable normal freezing.
[Service]
Environment="SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=true"
