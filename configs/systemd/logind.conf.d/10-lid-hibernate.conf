# /etc/systemd/logind.conf.d/10-lid-hibernate.conf
# Escalate a long lid-close s2idle to hibernate (S4) instead of sitting in
# s2idle forever. ExternalPower is included because the overnight freeze
# happened on AC. See sleep.conf.d/10-hibernate-delay.conf for the delay.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
