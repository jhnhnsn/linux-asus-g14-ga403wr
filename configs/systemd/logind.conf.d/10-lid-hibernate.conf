# Lid-close behaviour: hibernate (S4), by user choice (2026-06-14).
#
# Why not s2idle: the G14's s2idle resume intermittently WEDGES because, during
# deep s0ix, the EC dispatches an ACPI D-notifier (Notify 0xD4) to PEGP (the dGPU)
# and the still-bound nvidia driver fails to handle it
# (NVRM: RmHandleDNotifierEvent ... status=0x11), occasionally hanging resume.
# Root-caused 2026-06-14 via amd-s2idle replay. cardwire only blocks the dGPU
# device NODES, so nvidia stays bound and keeps choking on these events.
#
# Hibernate sidesteps it entirely: the machine powers FULLY OFF, so there is no
# s0ix and no EC poking the dGPU. It also draws zero battery while closed, so it's
# safe overnight. Verified working 2026-06-14 (true restore, same boot id).
# The nvidia-teardown sleep hook (80-nvidia-teardown.sh) unloads nvidia before the
# image is written and reloads it on resume, so no nvidia state is baked into the image.
#
# Clamshell preserved: HandleLidSwitchDocked is left UNSET (= ignore), so closing
# the lid with an external monitor connected does NOT hibernate (keeps working on
# the external display). Hibernate applies on battery and on AC-without-dock.
#
# Manual s2idle is still available via `systemctl suspend` (now also covered by the
# teardown hook) if a fast resume is ever wanted.
#
# Backups: 10-lid-suspend.conf.bak.20260614_suspend (plain s2idle),
#          10-lid-suspend.conf.bak.20260613_s-t-h   (original suspend-then-hibernate)
[Login]
HandleLidSwitch=hibernate
HandleLidSwitchExternalPower=hibernate
