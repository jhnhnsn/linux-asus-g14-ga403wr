# Lid-close behaviour: IGNORE at the logind level (2026-06-16, by user choice).
#
# logind does nothing on lid close; instead niri's switch-events blank the
# displays (power-off-monitors) so the machine keeps RUNNING with the screen off.
# Closing the lid no longer changes power state, so it cannot trigger either
# failure mode we hit before:
#   - s2idle resume WEDGE (EC fires ACPI D-notifier 0xD4 at the still-bound
#     nvidia dGPU; NVRM: RmHandleDNotifierEvent ... status=0x11), and
#   - the rare S4 hibernate hang at the firmware power-off step.
#
# Hibernate is now EXPLICIT only: `systemctl hibernate` or the DMS power menu.
# Both route through systemd-hibernate.service and still fire the nvidia teardown
# sleep hook (/usr/lib/systemd/system-sleep/80-nvidia-teardown.sh, now the g14-diag sleep guard), so the dGPU is
# unloaded before the image is written and reloaded on resume.
#
# Clamshell on a dock is unaffected (HandleLidSwitchDocked is unset = ignore).
#
# Previous lid configs (for rollback):
#   10-lid-hibernate.conf.bak.20260616_hibernate   (hibernate on lid)
#   10-lid-suspend.conf.bak.20260614_suspend        (plain s2idle)
#   10-lid-suspend.conf.bak.20260613_s-t-h          (suspend-then-hibernate)
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
