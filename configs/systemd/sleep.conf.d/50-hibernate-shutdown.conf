# Power off at the end of a hibernate through the kernel (the same path as `poweroff`)
# instead of the firmware's ACPI S4 handoff. See issue #10.
#
# systemd-sleep writes HibernateMode= to /sys/power/disk on EVERY hibernate (default
# "platform shutdown"), so this is the only place the setting sticks. The old
# tmpfiles.d rule wrote "shutdown" at boot and was silently overwritten each time.
#
# Why not platform (S4)? It works here with the nvidia guard (verified 2026-10-21), but S4
# arms the ACPI wake devices (USB4 bridge, PCIe root ports: see /proc/acpi/wakeup), so a
# stray wake event can power the laptop back on in a bag. S5 only wakes on the power button.
# Check which mode a hibernate used: `g14-diag hibernations` (mode=platform|shutdown).
[Sleep]
HibernateMode=shutdown
