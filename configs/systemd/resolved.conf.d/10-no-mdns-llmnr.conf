# /etc/systemd/resolved.conf.d/10-no-mdns-llmnr.conf
#
# Leave mDNS to avahi-daemon and turn LLMNR off.
#
# With both resolved and avahi answering on udp/5353, two mDNS responders fight over
# the port. And while UFW dropped 5353/5355, every single-label lookup waited out the
# full LLMNR/mDNS timeout (3.7-5.9 s, diagnosed 2026-09-18). avahi publishes
# cachyos-g14.local once UFW allows 5353 from the LAN:
#   sudo ufw allow from 192.168.0.0/24 to any port 5353 proto udp comment 'mDNS from LAN'
[Resolve]
MulticastDNS=no
LLMNR=no
